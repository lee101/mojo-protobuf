[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-protobuf"
version = "0.1.0"
description = "Mojo-accelerated Protocol Buffers wire-format primitives"
requires-python = ">=3.10"
dependencies = ["numpy", "protobuf"]
license = "MIT"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
